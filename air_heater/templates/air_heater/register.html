<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
  <meta charset="utf-8">
  <title>Register</title>
 
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.css" rel="stylesheet">

</head>
<body class="bg-base-200 flex justify-center items-center h-screen">

<div class="card w-96 bg-base-100 shadow-xl p-6">
  <h2 class="text-2xl font-bold mb-4 text-center">Create Account</h2>

  <form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username"
           class="input input-bordered w-full mb-3" required>
    <input type="password" name="password" placeholder="Password"
           class="input input-bordered w-full mb-3" required>

    <button class="btn btn-primary w-full mt-4">Register</button>
  </form>

  <p class="text-center mt-3 text-sm">
    Already have an account? <a class="text-blue-500" href="{% url "login" %}">Login</a>
  </p>
</div>

</body>
</html>
