<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Temperature Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

    </style>
</head>

<body class=" bg-base-200 p-6 ">
<header class="w-full text-center py-4  flex justify-between px-20">
    <nav class="navbar bg-base-300/100 shadow rounded-box shadow-lg px-8">
        <div class="flex-1">
            <a class="text-xl font-bold">Air Heater Monitoring</a>
        </div>

        <div class="flex-none gap-4">


            <label class="swap swap-rotate">
                <input type="checkbox" id="theme-toggle"/>

                <!-- sun icon -->
                <svg class="swap-on fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M5.64 17l-.71.71a1 1 0 0 0 1.41 1.41l.71-.71A1 1 0 0 0 5.64 17zM12 18a6 6 0 1 0-6-6 6 6 0 0 0 6 6zm8 1a1 1 0 0 0 .71-1.71l-.71-.71a1 1 0 1 0-1.41 1.41l.71.71A1 1 0 0 0 20 19zm1-7h-1a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2zM4 12H3a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2zm15.66-6.66a1 1 0 0 0-1.41 0l-.71.71A1 1 0 0 0 19.66 7l.71-.71a1 1 0 0 0 0-1.41zM12 4a1 1 0 0 0 1-1V2a1 1 0 0 0-2 0v1a1 1 0 0 0 1 1z"></path>
                </svg>

                <!-- moon icon -->
                <svg class="swap-off fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 0 1 11.21 3 7 7 0 0 0 12 17a7 7 0 0 0 9-4.21z"></path>
                </svg>
            </label>


            <a href="{% url "logout" %}" class="btn btn-sm btn-error">Logout</a>
            <a href="{% url "login" %}" class="btn btn-sm">Login</a>
            <a href="{% url "register" %}" class="btn btn-sm btn-primary">Signup</a>
        </div>
    </nav>
</header>

<main class="container mx-auto p-1 ">

    <div class="w-full flex justify-center p-6 bg-base-200">
        <div
                class="card w-64 bg-base-100/40 shadow-xl rounded-2xl
               transition-all duration-300
                hover:shadow-2xl
                hover:-translate-y-2 ease-out group"


        >
            <div class="card-body items-center text-center">
                <h2 class="card-title text-lg">Last Temperature</h2>


                <div
                        id="temp-value"
                        class="text-5xl flex font-bold my-4 transition-all duration-300"

                >
                    <span id="temp-number">{{ data|last }}</span>
                    <span class="ml-1">°C</span>
                </div>

            </div>
        </div>
    </div>

    <div class="w-full max-w-6xl mx-auto mt-1">
        <canvas id="tempChart" class="bg-base-100/40 rounded-box shadow-lg h-96"></canvas>
    </div>
</main>

<script>

    const ctx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: {{ labels|safe|default:"[]" }},
            datasets: [{
                label: 'Temperature (°C)',
                data: {{ data|safe|default:"[]" }},
                borderColor: 'rgb(34, 197, 94)',
                backgroundColor: 'rgba(34, 197, 94, 0.2)',
                fill: true,
                tension: 0.1,

            }]
        },
        options: {
            responsive: true,

            plugins: {
                legend: {display: true}
            },
            scales: {
                y: {beginAtZero: false}
            }
        }
    });

    let lastTs = null;

    function updateColor(value) {
        const tempEl = document.getElementById("temp-value");
        if (!tempEl) return;

        const temp = parseFloat(value);

        tempEl.classList.remove("text-blue-400", "text-green-400", "text-red-400",
            "drop-shadow-[0_0_15px_rgba(59,130,246,0.9)]",
            "drop-shadow-[0_0_15px_rgba(34,197,94,0.9)]",
            "drop-shadow-[0_0_15px_rgba(239,68,68,0.9)]");

        if (temp < 15) {
            tempEl.classList.add("text-blue-400", "drop-shadow-[0_0_15px_rgba(59,130,246,0.9)]");
        } else if (temp >= 15 && temp <= 30) {
            tempEl.classList.add("text-green-400", "drop-shadow-[0_0_15px_rgba(34,197,94,0.9)]");
        } else {
            tempEl.classList.add("text-red-400", "drop-shadow-[0_0_15px_rgba(239,68,68,0.9)]");
        }
    }

    function fetchLiveTemperature() {
        fetch("/api/live-temperature/")
            .then(res => res.json())
            .then(data => {
                if (!data.value || data.ts === lastTs) return;

                lastTs = data.ts;

                const value = parseFloat(data.value).toFixed(1);


                const hours = new Date().getHours();
                const minutes = new Date().getMinutes();
                const now = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;

                const tempNumberEl = document.getElementById("temp-number");
                if (tempNumberEl) {
                    tempNumberEl.innerText = value;
                    updateColor(value);
                }

                tempChart.data.labels.push(now);
                tempChart.data.datasets[0].data.push(parseFloat(value));

                if (tempChart.data.labels.length > 100) {
                    tempChart.data.labels.shift();
                    tempChart.data.datasets[0].data.shift();
                }

                tempChart.update();
            });
    }

    setInterval(fetchLiveTemperature, 10000);


    document.addEventListener("DOMContentLoaded", () => {
        const initial = document.getElementById("temp-number").innerText;
        if (initial && initial !== "--") updateColor(initial);

        const toggle = document.getElementById("theme-toggle");
        const html = document.documentElement;
        if (localStorage.theme === "dark") {
            html.setAttribute("data-theme", "dark");
            toggle.checked = true;
        }
        toggle.addEventListener("change", () => {
            if (toggle.checked) {
                html.setAttribute("data-theme", "dark");
                localStorage.theme = "dark";
            } else {
                html.setAttribute("data-theme", "light");
                localStorage.theme = "light";
            }
        });
    });
</script>

</body>
</html>
